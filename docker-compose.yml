
services:
  postgres:
    image: postgres:17
    container_name: ksi_opinion_base
    environment:
      POSTGRES_USER: ksi_opinion_base
      POSTGRES_PASSWORD: ksi_opinion_base
      POSTGRES_DB: ksi_opinion_base
    ports:
      - "5434:5432"  # mapowanie portów, host 5434 -> kontener 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksi_opinion_base -d ksi_opinion_base"]
      interval: 5s
      timeout: 5s
      retries: 5

  loader:
    build:
      context: .
      dockerfile: database/Dockerfile
    container_name: ksi_opinion_loader
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ksi_opinion_base
      DB_PASSWORD: ksi_opinion_base
      DB_NAME: ksi_opinion_base

  fast_api:
    build: ./backend
    container_name: fast_api_app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    restart: unless-stopped

  # frontend:
  #   build: ./frontend
  #   container_name: next_frontend_app
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - fast_api
  #   restart: unless-stopped

volumes:
  pgdata:
