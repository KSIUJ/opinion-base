version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: ksi_opinion_base
    environment:
      POSTGRES_USER: ksi_opinion_base
      POSTGRES_PASSWORD: ksi_opinion_base
      POSTGRES_DB: ksi_opinion_base
    ports:
      - "5433:5432"  # mapowanie portów, host 5433 -> kontener 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: